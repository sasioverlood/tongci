<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe5" />
    <title>同词相见</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain"></div>
    <main class="shell">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">同</div>
        <div>
          <p class="eyebrow">SAME WORD</p>
          <h1>同词相见</h1>
        </div>
      </header>

      <section id="homeView" class="view active">
        <div class="hero-card">
          <p class="hero-kicker">默契，不需要提前排练</p>
          <h2>你想到的，<br /><span>会和我一样吗？</span></h2>
          <p class="hero-copy">各自写下一个联想到的词，同时揭晓。没有相同，就用刚才的词继续联想，直到大家想到同一个答案。</p>
          <div class="steps">
            <span><b>01</b> 独立联想</span>
            <span><b>02</b> 同时揭晓</span>
            <span><b>03</b> 越猜越近</span>
          </div>
        </div>

        <div class="panel home-panel">
          <label class="field">
            <span>你的称呼</span>
            <input id="nameInput" maxlength="12" autocomplete="nickname" placeholder="例如：小明" />
          </label>

          <details class="server-settings">
            <summary>联机服务器设置</summary>
            <label class="field">
              <span>后端 WebSocket 地址</span>
              <input id="serverInput" autocomplete="url" placeholder="例如：wss://example.trycloudflare.com" />
            </label>
            <p>部署到 GitHub Pages 后，需要填写你电脑隧道生成的 HTTPS 或 WSS 地址。</p>
          </details>

          <div class="create-options">
            <div class="option-group">
              <span class="option-label">房间人数</span>
              <div class="segmented" id="playerCount">
                <button class="selected" data-value="2">2 人</button>
                <button data-value="3">3 人</button>
              </div>
            </div>
            <div class="option-group">
              <span class="option-label">每轮时间</span>
              <div class="segmented" id="roundTime">
                <button data-value="30">30 秒</button>
                <button class="selected" data-value="60">60 秒</button>
                <button data-value="90">90 秒</button>
              </div>
            </div>
          </div>

          <button id="createButton" class="primary-button">创建私人房间 <span>→</span></button>

          <div class="divider"><span>或者加入朋友的房间</span></div>
          <div class="join-row">
            <input id="codeInput" maxlength="6" placeholder="输入 6 位房间码" />
            <button id="joinButton" class="secondary-button">加入</button>
          </div>
        </div>
      </section>

      <section id="roomView" class="view">
        <div class="room-topbar">
          <button id="leaveButton" class="icon-button" aria-label="离开房间">←</button>
          <div class="room-code-wrap">
            <span>房间码</span>
            <button id="copyCodeButton" class="room-code">------</button>
          </div>
          <div id="connectionBadge" class="connection-badge">已连接</div>
        </div>

        <section class="game-card">
          <div class="round-row">
            <span id="phaseLabel">等待玩家</span>
            <span id="roundLabel">准备中</span>
          </div>
          <div id="timer" class="timer" aria-live="polite">--</div>
          <h2 id="gameTitle">邀请朋友加入</h2>
          <p id="gameHint">复制房间码或分享当前页面，等人到齐后开始。</p>

          <div id="players" class="players"></div>

          <div id="thinkingControls" class="thinking-controls hidden">
            <label class="word-field">
              <span>写下你想到的词</span>
              <input id="wordInput" maxlength="20" autocomplete="off" placeholder="别人看不到你的答案" />
            </label>
            <button id="submitButton" class="primary-button">锁定答案</button>
          </div>

          <div id="hostControls" class="host-controls"></div>
        </section>

        <section id="historySection" class="history-section hidden">
          <button id="historyToggle" class="history-toggle" type="button">收起联想足迹</button>
          <div id="history" class="history"></div>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
